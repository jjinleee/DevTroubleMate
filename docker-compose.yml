services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devtroublemate-db
    environment:
      POSTGRES_DB: devtroublemate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: